$kind: http-request
name: Get Machine Game Settings
method: GET
url: '{{baseUrl}}/api/v1/stores/{{storeId}}/machines/{{machineId}}/games/{{gameId}}/settings'
order: 10000
description: |-
  Returns override records for this machine/game. Empty array means no override; use machineSettingsVersion 0 for first creation. This version is independent of game settingsVersion.
  
  **Authorization:** STORE_OWNER, HQ_SUPER_ADMIN or STORE_STAFF, or READ_ONLY_AUDITOR
  
  **Common errors:** 400 INVALID_PAYLOAD / invalid state; 401 AUTH_REQUIRED; 403 FORBIDDEN; 404 NOT_FOUND; 409 STALE_VERSION / CONFLICT. Business success returns HTTP 200, including create/delete. Rate limiting can return 429.
  
  ### Request input example
  
  This GET endpoint does not accept a JSON body. Use the URL identifiers and the **Params** tab.
  
  ```text
  {{baseUrl}}/api/v1/stores/{{storeId}}/machines/{{machineId}}/games/{{gameId}}/settings
  ```
scripts:
  - type: afterResponse
    code: |-
      let result; try { result = pm.response.json(); } catch (_) {}
      if (pm.response.code >= 200 && pm.response.code < 300 && result && result.ok !== false) {
        const value = "0.version".split('.').reduce((node, key) => node == null ? undefined : node[key], result.data);
        if (value !== undefined) pm.collectionVariables.set('machineSettingsVersion', value == null ? '' : String(value));
      }
    language: text/javascript
