$kind: http-request
name: Liveness Check
method: GET
url: '{{baseUrl}}/health/live'
order: 1000
auth:
  type: noauth
description: |-
  Checks whether the HTTP server is running. Does not check MongoDB.
  
  **Authorization:** No Bearer token required.
  
  **Common errors:** 400 INVALID_PAYLOAD / invalid state; 401 AUTH_REQUIRED; 403 FORBIDDEN; 404 NOT_FOUND; 409 STALE_VERSION / CONFLICT. Business success returns HTTP 200, including create/delete. Rate limiting can return 429.
  
  ### Request input example
  
  This GET endpoint does not accept a JSON body. Use the URL identifiers and the **Params** tab.
  
  ```text
  {{baseUrl}}/health/live
  ```
scripts:
  - type: afterResponse
    code: |-
      let result; try { result = pm.response.json(); } catch (_) {}
      if (pm.response.code >= 200 && pm.response.code < 300 && result && result.ok !== false) {
      }
    language: text/javascript
