$kind: http-request
name: Login
method: POST
url: '{{baseUrl}}/api/v1/auth/login'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "storeId": "{{storeId}}",
      "username": "admin",
      "password": "your_password"
    }
description: |-
  Required: storeId, username, password. Verifies active user/store and configured HQ entitlement. Captures accessToken and refreshToken; access lifetime is 3600 seconds.
  
  **Authorization:** No Bearer token required.
  
  **Common errors:** 400 INVALID_PAYLOAD / invalid state; 401 AUTH_REQUIRED; 403 FORBIDDEN; 404 NOT_FOUND; 409 STALE_VERSION / CONFLICT. Business success returns HTTP 200, including create/delete. Rate limiting can return 429.
  
  ### Request body example
  
  Open **Body → raw → JSON**. Replace variables using collection values before sending. Numeric versions resolve to integers.
  
  ```json
  {
    "storeId": "{{storeId}}",
    "username": "admin",
    "password": "your_password"
  }
  ```
scripts:
  - type: afterResponse
    code: |-
      let result; try { result = pm.response.json(); } catch (_) {}
      if (pm.response.code >= 200 && pm.response.code < 300 && result && result.ok !== false) {
        pm.collectionVariables.set('accessToken', result.data.accessToken);
        pm.collectionVariables.set('refreshToken', result.data.refreshToken);
      }
    language: text/javascript
