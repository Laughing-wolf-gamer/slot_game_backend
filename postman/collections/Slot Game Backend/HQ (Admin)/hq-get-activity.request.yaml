$kind: http-request
name: HQ Get Activity
method: GET
url: "{{baseUrl}}/api/v1/hq/activity"
order: 2000
queryParams:
  - key: storeId
    value: ''
    disabled: true
  - key: cursor
    value: ''
    disabled: true
  - key: limit
    value: '100'
    disabled: true
auth:
  type: bearer
  credentials:
    token: "{{hqAccessToken}}"
description: |-
  Returns audit records across locally managed stores or the selected store filter. Pass top-level nextCursor as cursor for the next page.
  
  **Authorization:** HQ_SUPER_ADMIN only
  Uses hqAccessToken.
  
  **Common errors:** 400 INVALID_PAYLOAD / invalid state; 401 AUTH_REQUIRED; 403 FORBIDDEN; 404 NOT_FOUND; 409 STALE_VERSION / CONFLICT. Business success returns HTTP 200, including create/delete. Rate limiting can return 429.
  
  ### Request input example
  
  This GET endpoint does not accept a JSON body. Use the URL identifiers and the **Params** tab.
  
  ```text
  {{baseUrl}}/api/v1/hq/activity?limit=100
  ```
  
  Optional filters are listed in Params and disabled initially. Enable only the filters needed for your query.
scripts:
  - type: afterResponse
    code: |-
      let result; try { result = pm.response.json(); } catch (_) {}
      if (pm.response.code >= 200 && pm.response.code < 300 && result && result.ok !== false) {
        pm.collectionVariables.set('hqCursor', result.nextCursor || '');
      }
    language: text/javascript
