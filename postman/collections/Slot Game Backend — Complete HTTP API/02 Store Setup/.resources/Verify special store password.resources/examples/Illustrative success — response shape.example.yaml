$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/stores/{{storeId}}/passwords/verify"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "eventId": "{{_requestEventId}}",
        "kind": "{{passwordKind}}",
        "password": "{{storePassword}}"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "ok": true,
        "eventId": "{{_requestEventId}}",
        "data": {
          "verified": true,
          "kind": "{{passwordKind}}"
        },
        "error": null
      }
order: 1000
