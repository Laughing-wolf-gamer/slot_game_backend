$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/stores/{{storeId}}/environment"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "ok": false,
        "error": {
          "code": "INVALID_PAYLOAD",
          "message": "Payload validation failed"
        }
      }
order: 2000
