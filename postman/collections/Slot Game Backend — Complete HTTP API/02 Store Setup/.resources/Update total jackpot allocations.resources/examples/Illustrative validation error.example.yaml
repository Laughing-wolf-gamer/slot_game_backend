$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/stores/{{storeId}}/jackpot-settings"
  method: PUT
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "eventId": "{{_requestEventId}}",
        "expectedVersion": {{configVersion}},
        "reason": "{{reason}}",
        "allocations": {
          "smallJackpot": {
            "percentageBps": 9500
          },
          "mediumJackpot": {
            "percentageBps": 450
          },
          "bigJackpot": {
            "percentageBps": 50
          }
        }
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "ok": false,
        "error": {
          "code": "INVALID_PAYLOAD",
          "message": "Payload validation failed"
        }
      }
order: 2000
