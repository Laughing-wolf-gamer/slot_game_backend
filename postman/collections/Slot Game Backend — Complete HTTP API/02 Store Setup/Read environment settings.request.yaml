$kind: http-request
description: |-
  Returns store configuration, including environment and stateVersion.
  
  **Authorization:** STORE_OWNER, HQ_SUPER_ADMIN or STORE_STAFF, or READ_ONLY_AUDITOR
  
  **Common errors:** 400 INVALID_PAYLOAD / invalid state; 401 AUTH_REQUIRED; 403 FORBIDDEN; 404 NOT_FOUND; 409 STALE_VERSION / CONFLICT. Business success returns HTTP 200, including create/delete. Rate limiting can return 429.
  
  ### Request input example
  
  This GET endpoint does not accept a JSON body. Use the URL identifiers and the **Params** tab.
  
  ```text
  {{baseUrl}}/api/v1/stores/{{storeId}}/environment
  ```
url: "{{baseUrl}}/api/v1/stores/{{storeId}}/environment"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      let result; try { result = pm.response.json(); } catch (_) {}
      if (pm.response.code >= 200 && pm.response.code < 300 && result && result.ok !== false) {
        const value = "stateVersion".split('.').reduce((node, key) => node == null ? undefined : node[key], result.data);
        if (value !== undefined) pm.collectionVariables.set('configVersion', value == null ? '' : String(value));
      }
    language: text/javascript
examples: ./.resources/Read environment settings.resources/examples
order: 3000
