$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/stores/{{storeId}}/games/{{gameId}}/settings"
  method: PUT
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "eventId": "{{_requestEventId}}",
        "expectedVersion": {{settingsVersion}},
        "reason": "{{reason}}",
        "settings": {
          "smallJackpot": {
            "percentageBps": 9500
          },
          "mediumJackpot": {
            "percentageBps": 450
          },
          "bigJackpot": {
            "percentageBps": 50
          },
          "normalWinning": {
            "percentageBps": 8000
          },
          "rtp": {
            "targetBps": 9500
          },
          "commission": {
            "enabled": false,
            "percentageBps": 0
          },
          "network": {
            "contributionPerMinute": 0,
            "threshold": 10000
          }
        }
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "ok": false,
        "error": {
          "code": "INVALID_PAYLOAD",
          "message": "Payload validation failed"
        }
      }
order: 2000
