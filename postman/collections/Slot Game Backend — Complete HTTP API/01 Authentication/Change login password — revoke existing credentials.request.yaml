$kind: http-request
description: |-
  Required: currentPassword, newPassword (12–256 characters). Changes the password, increments tokenVersion and revokes all refresh tokens atomically. Log in again afterward.
  
  **Authorization:** Any active authenticated administrator
  
  **Common errors:** 400 INVALID_PAYLOAD / invalid state; 401 AUTH_REQUIRED; 403 FORBIDDEN; 404 NOT_FOUND; 409 STALE_VERSION / CONFLICT. Business success returns HTTP 200, including create/delete. Rate limiting can return 429.
  
  ### Request body example
  
  Open **Body → raw → JSON**. Replace variables using collection values before sending. Numeric versions resolve to integers.
  
  ```json
  {
    "currentPassword": "{{password}}",
    "newPassword": "{{newPassword}}"
  }
  ```
url: "{{baseUrl}}/api/v1/auth/change-password"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{password}}",
      "newPassword": "{{newPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      let result; try { result = pm.response.json(); } catch (_) {}
      if (pm.response.code >= 200 && pm.response.code < 300 && result && result.ok !== false) {
      }
    language: text/javascript
examples: ./.resources/Change login password — revoke existing credentials.resources/examples
order: 5000
