$kind: http-request
description: |-
  Required: refreshToken. Revokes that refresh token; an already-issued access token remains valid until expiry or tokenVersion invalidation.
  
  **Authorization:** No Bearer token required.
  
  **Common errors:** 400 INVALID_PAYLOAD / invalid state; 401 AUTH_REQUIRED; 403 FORBIDDEN; 404 NOT_FOUND; 409 STALE_VERSION / CONFLICT. Business success returns HTTP 200, including create/delete. Rate limiting can return 429.
  
  ### Request body example
  
  Open **Body → raw → JSON**. Replace variables using collection values before sending. Numeric versions resolve to integers.
  
  ```json
  {
    "refreshToken": "{{refreshToken}}"
  }
  ```
url: "{{baseUrl}}/api/v1/auth/logout"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      let result; try { result = pm.response.json(); } catch (_) {}
      if (pm.response.code >= 200 && pm.response.code < 300 && result && result.ok !== false) {
        pm.collectionVariables.set('refreshToken', '');
      }
    language: text/javascript
examples: ./.resources/Log out — revoke refresh token.resources/examples
order: 3000
