$kind: http-request
description: |-
  Required: password. Verifies the authenticated user password and audits the result. Returns {verified:true}.
  
  **Authorization:** Any active authenticated administrator
  
  **Common errors:** 400 INVALID_PAYLOAD / invalid state; 401 AUTH_REQUIRED; 403 FORBIDDEN; 404 NOT_FOUND; 409 STALE_VERSION / CONFLICT. Business success returns HTTP 200, including create/delete. Rate limiting can return 429.
  
  ### Request body example
  
  Open **Body → raw → JSON**. Replace variables using collection values before sending. Numeric versions resolve to integers.
  
  ```json
  {
    "password": "{{password}}"
  }
  ```
url: "{{baseUrl}}/api/v1/auth/verify-password"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      let result; try { result = pm.response.json(); } catch (_) {}
      if (pm.response.code >= 200 && pm.response.code < 300 && result && result.ok !== false) {
      }
    language: text/javascript
examples: ./.resources/Verify current administrator password.resources/examples
order: 4000
