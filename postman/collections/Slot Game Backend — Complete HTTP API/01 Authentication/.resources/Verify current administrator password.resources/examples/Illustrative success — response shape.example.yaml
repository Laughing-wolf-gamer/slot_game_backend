$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/verify-password"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "password": "{{password}}"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "ok": true,
        "data": {
          "verified": true
        }
      }
order: 1000
