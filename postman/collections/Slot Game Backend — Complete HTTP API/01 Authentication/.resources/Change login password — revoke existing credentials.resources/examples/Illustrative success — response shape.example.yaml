$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/change-password"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "currentPassword": "{{password}}",
        "newPassword": "{{newPassword}}"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "ok": true,
        "data": {
          "changed": true,
          "loginRequired": true
        }
      }
order: 1000
