$kind: http-example
auth:
  type: bearer
  credentials:
    token: "{{hqAccessToken}}"
request:
  url: "{{baseUrl}}/api/v1/hq/stores/{{hqStoreId}}/devices"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "eventId": "{{_requestEventId}}",
        "deviceId": "{{agentDeviceId}}",
        "role": "DEVICE_TAS_C",
        "machineId": "{{hqMachineId}}",
        "secret": "{{deviceSecret}}",
        "reason": "{{reason}}"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "ok": true,
        "eventId": "{{_requestEventId}}",
        "serverSequence": 1,
        "serverTime": "2026-10-14T00:00:00.000Z",
        "stateVersion": null,
        "data": {},
        "error": null
      }
order: 1000
