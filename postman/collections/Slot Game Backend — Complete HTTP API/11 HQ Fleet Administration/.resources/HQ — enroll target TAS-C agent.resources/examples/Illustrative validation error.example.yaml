$kind: http-example
auth:
  type: bearer
  credentials:
    token: "{{hqAccessToken}}"
request:
  url: "{{baseUrl}}/api/v1/hq/stores/{{hqStoreId}}/devices"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "eventId": "{{_requestEventId}}",
        "deviceId": "{{agentDeviceId}}",
        "role": "DEVICE_TAS_C",
        "machineId": "{{hqMachineId}}",
        "secret": "{{deviceSecret}}",
        "reason": "{{reason}}"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "ok": false,
        "error": {
          "code": "INVALID_PAYLOAD",
          "message": "Payload validation failed"
        }
      }
order: 2000
