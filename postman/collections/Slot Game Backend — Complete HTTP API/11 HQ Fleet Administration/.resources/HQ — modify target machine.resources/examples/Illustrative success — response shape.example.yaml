$kind: http-example
auth:
  type: bearer
  credentials:
    token: "{{hqAccessToken}}"
request:
  url: "{{baseUrl}}/api/v1/hq/stores/{{hqStoreId}}/machines/{{hqMachineId}}"
  method: PATCH
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "eventId": "{{_requestEventId}}",
        "expectedVersion": {{hqMachineVersion}},
        "reason": "{{reason}}",
        "ipAddress": "127.0.0.1",
        "feePlan": 10
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "ok": true,
        "eventId": "{{_requestEventId}}",
        "serverSequence": 1,
        "serverTime": "2026-10-14T00:00:00.000Z",
        "stateVersion": null,
        "data": {},
        "error": null
      }
order: 1000
