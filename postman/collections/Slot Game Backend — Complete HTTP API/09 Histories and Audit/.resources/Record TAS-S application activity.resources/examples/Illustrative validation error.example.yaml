$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/stores/{{storeId}}/activities"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "eventId": "{{_requestEventId}}",
        "category": "admin-activity",
        "success": true,
        "cardId": "{{cardId}}",
        "message": "Operator opened card screen"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "ok": false,
        "error": {
          "code": "INVALID_PAYLOAD",
          "message": "Payload validation failed"
        }
      }
order: 2000
