$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/stores/{{storeId}}/machines/{{machineId}}"
  method: PATCH
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "eventId": "{{_requestEventId}}",
        "expectedVersion": {{machineVersion}},
        "reason": "{{reason}}",
        "machineNumber": 1,
        "feePlan": 10,
        "ipAddress": "127.0.0.1",
        "supplyDate": "2026-10-14T00:00:00.000Z"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "ok": false,
        "error": {
          "code": "INVALID_PAYLOAD",
          "message": "Payload validation failed"
        }
      }
order: 2000
