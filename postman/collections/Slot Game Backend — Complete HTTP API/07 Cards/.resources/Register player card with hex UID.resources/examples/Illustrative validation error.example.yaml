$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/stores/{{storeId}}/cards"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "eventId": "{{_requestEventId}}",
        "cardId": "{{cardId}}",
        "cardUid": "{{cardUid}}",
        "displayNumber": "0001",
        "name": "Player Card",
        "points": 0,
        "timeMinutes": 0,
        "kind": "PLAYER",
        "date": "2026-10-14T00:00:00.000Z"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "ok": false,
        "error": {
          "code": "INVALID_PAYLOAD",
          "message": "Payload validation failed"
        }
      }
order: 2000
