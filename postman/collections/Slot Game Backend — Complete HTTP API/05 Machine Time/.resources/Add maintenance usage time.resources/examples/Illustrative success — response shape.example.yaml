$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/stores/{{storeId}}/machines/{{machineId}}/time/maintenance"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "eventId": "{{_requestEventId}}",
        "expectedVersion": {{machineVersion}},
        "reason": "{{reason}}",
        "cardId": "{{cardId}}",
        "minutes": 5
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "ok": true,
        "eventId": "{{_requestEventId}}",
        "serverSequence": 1,
        "serverTime": "2026-10-14T00:00:00.000Z",
        "stateVersion": null,
        "data": {},
        "error": null
      }
order: 1000
