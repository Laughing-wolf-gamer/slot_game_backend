$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/stores/{{storeId}}/devices"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "eventId": "{{_requestEventId}}",
        "deviceId": "{{kioskDeviceId}}",
        "role": "DEVICE_TAS_K",
        "kioskId": "{{kioskId}}",
        "secret": "{{deviceSecret}}",
        "reason": "{{reason}}"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "ok": false,
        "error": {
          "code": "INVALID_PAYLOAD",
          "message": "Payload validation failed"
        }
      }
order: 2000
