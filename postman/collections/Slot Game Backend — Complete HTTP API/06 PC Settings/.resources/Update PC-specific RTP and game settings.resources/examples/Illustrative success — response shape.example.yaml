$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/stores/{{storeId}}/machines/{{machineId}}/games/{{gameId}}/settings"
  method: PUT
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "eventId": "{{_requestEventId}}",
        "expectedVersion": {{machineSettingsVersion}},
        "reason": "{{reason}}",
        "settings": {
          "smallJackpot": {
            "percentageBps": 9500
          },
          "mediumJackpot": {
            "percentageBps": 450
          },
          "bigJackpot": {
            "percentageBps": 50
          },
          "normalWinning": {
            "percentageBps": 8000
          },
          "rtp": {
            "targetBps": 9500
          },
          "commission": {
            "enabled": false,
            "percentageBps": 0
          },
          "network": {
            "contributionPerMinute": 0,
            "threshold": 10000
          }
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "ok": true,
        "eventId": "{{_requestEventId}}",
        "serverSequence": 1,
        "serverTime": "2026-10-14T00:00:00.000Z",
        "stateVersion": null,
        "data": {},
        "error": null
      }
order: 1000
